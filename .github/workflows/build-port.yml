name: Build Lichii Nixport Port
on:
  workflow_dispatch:
    inputs:
      appimage_url:
        description: "Direct URL to lichii-linux-aarch64.AppImage"
        required: true
      qt_version:
        description: "Qt version to bundle (6.7+ has ARM64 builds)"
        default: "6.8.3"
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl python3-pip libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 \
            libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 libgl1 libegl1 libopengl0
          pip install --break-system-packages aqtinstall
      - name: Install Qt (ARM64)
        run: aqt install-qt linux_arm64 desktop ${{ inputs.qt_version }} linux_gcc_arm64 -O "$HOME/Qt"
      - name: Download original AppImage
        run: curl -fL -o lichii-linux-aarch64.AppImage "${{ inputs.appimage_url }}"
      - name: Build port
        run: bash scripts/build-port.sh lichii-linux-aarch64.AppImage "$HOME/Qt/${{ inputs.qt_version }}/gcc_arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: lichii-port
          path: out/lichii-port.zip
